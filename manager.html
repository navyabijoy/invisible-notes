<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Notes Manager</title>
<style>
  :root {
    --accent:      #5b4bff;
    --accent-dk:   #4a3ae8;
    --accent-lt:   #f0edff;
    --ink:         #0c0c0e;
    --ink-2:       #1c1c22;
    --muted:       #6b7280;
    --muted-2:     #9ca3af;
    --border:      #e4e4e8;
    --border-2:    #d1d1d8;
    --bg:          #f7f7f9;
    --surface:     #ffffff;
    --surface-2:   #f4f4f7;
    --r:           12px;
    --r-lg:        14px;
    --sh:          0 1px 2px rgba(0,0,0,0.04), 0 1px 1px rgba(0,0,0,0.03);
    --sh-hover:    0 6px 18px rgba(20,20,30,0.08), 0 1px 3px rgba(20,20,30,0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; user-select: none; }

  /* ─── Toolbar ─────────────────────────────────────────── */
  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
  }

  .search-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap svg {
    position: absolute;
    left: 11px;
    color: var(--muted-2);
    pointer-events: none;
  }
  #search {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    padding: 8px 12px 8px 32px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #search::placeholder { color: var(--muted-2); }
  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-lt);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    white-space: nowrap;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: var(--accent-dk); }
  .btn:active { transform: scale(0.97); }

  /* ─── Workspace bar (issue #8) ────────────────────────── */
  .wsbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }

  .ws-select-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    min-width: 0;
  }
  .ws-select-wrap > svg {
    position: absolute;
    left: 10px;
    color: var(--accent);
    pointer-events: none;
  }
  .ws-select-wrap::after {
    content: "";
    position: absolute;
    right: 11px;
    width: 7px;
    height: 7px;
    border-right: 1.8px solid var(--muted);
    border-bottom: 1.8px solid var(--muted);
    transform: rotate(45deg) translate(-2px, -2px);
    pointer-events: none;
  }
  #workspaceSelect {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    padding: 8px 28px 8px 30px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    color: var(--ink);
    outline: none;
    cursor: pointer;
    text-overflow: ellipsis;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #workspaceSelect:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-lt);
  }

  /* Inline create/rename row. Electron disables window.prompt(), so the
     name is captured in the page rather than a native dialog. */
  .ws-form {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--accent-lt);
  }
  .ws-form[hidden] { display: none; }
  #wsNameInput {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border-2);
    background: var(--surface);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
  }
  #wsNameInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91, 75, 255, 0.15);
  }

  /* ─── List ────────────────────────────────────────────── */
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 100%;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 24px;
    line-height: 1.55;
  }
  .empty svg { color: var(--border-2); }

  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--r-lg);
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--sh);
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .card:hover {
    box-shadow: var(--sh-hover);
    border-color: var(--border-2);
  }

  .swatch {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    flex: 0 0 auto;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
  }

  .info { flex: 1; min-width: 0; }
  .title {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    font-family: inherit;
    padding: 2px 4px;
    margin: -2px -4px 1px;
    border-radius: 5px;
  }
  .title:hover { background: var(--surface-2); }
  .title:focus { background: var(--accent-lt); }
  .snippet {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta {
    font-size: 11px;
    color: var(--muted-2);
    margin-top: 3px;
  }

  .status {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 3px 8px;
    border-radius: 5px;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .status.visible { color: var(--accent-dk); }
  .status.hidden { color: var(--muted-2); }

  .actions { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    cursor: pointer;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    color: var(--muted);
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.danger:hover { background: #fdecec; color: #d3392e; }
  .actions-divider {
    width: 1px;
    height: 18px;
    background: var(--border);
    margin: 0 4px;
    flex: 0 0 auto;
  }

  /* Per-card "move to workspace" control. Only rendered when more than one
     workspace exists, so a single-workspace user never sees it.
     The icon is the visible affordance and the select sits transparently on
     top of it, sized to match .icon-btn. Showing the select's own label here
     would render a clipped fragment of the workspace name next to a native
     arrow inside 30px, and widening it on hover shifted the card layout. */
  .move-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    border-radius: 8px;
    color: var(--muted);
    transition: background 0.15s, color 0.15s;
  }
  .move-wrap:hover { background: var(--surface-2); color: var(--ink); }
  .move-wrap:focus-within {
    background: var(--surface-2);
    color: var(--ink);
    box-shadow: 0 0 0 2px var(--accent-lt);
  }
  .move-wrap > svg { pointer-events: none; }

  .move-select {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    padding: 0;
    margin: 0;
    background: transparent;
    color: transparent;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }
  /* The open dropdown is a native widget rendered outside the page's own
     styling, so it does not inherit the transparent colour above and the
     options need one of their own to stay readable. */
  .move-select option { color: var(--ink); }

  #version {
    flex: 0 0 auto;
    padding: 8px 12px;
    font-size: 11px;
    color: var(--muted-2);
    text-align: center;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
</style>
</head>
<body>
  <div class="wsbar">
    <div class="ws-select-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <select id="workspaceSelect" aria-label="Active workspace"></select>
    </div>
    <button class="icon-btn" id="wsNew" title="New workspace" aria-label="New workspace">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="icon-btn" id="wsRename" title="Rename workspace" aria-label="Rename workspace">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </button>
    <button class="icon-btn danger" id="wsDelete" title="Delete workspace" aria-label="Delete workspace">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
    </button>
  </div>

  <form class="ws-form" id="wsForm" hidden>
    <label class="sr-only" for="wsNameInput">Workspace name</label>
    <input id="wsNameInput" type="text" maxlength="40" placeholder="Workspace name…" autocomplete="off" />
    <button type="submit" class="btn" id="wsSave">Save</button>
    <button type="button" class="icon-btn" id="wsCancel" title="Cancel" aria-label="Cancel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </form>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Search notes…" />
    </div>
    <button class="btn" id="newNote">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New
    </button>
  </div>
  <div class="list" id="list"></div>
  <div id="version"></div>
  <script src="manager-renderer.js"></script>
</body>
</html>
