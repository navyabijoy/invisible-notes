name: Windows app installer

on:
  push:
    branches:
      - feat/independent-note-columns
    paths:
      - ".github/workflows/windows-installer.yml"
      - ".gitattributes"
      - "note/**"
      - "main.js"
      - "store.js"
      - "package*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-Notes-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish updated exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem dist/*.exe | Select-Object -First 1
          Copy-Item $installer.FullName Ghost-Notes-Columns-Setup.exe
          gh release create "layout-toggle-${{ github.run_id }}" Ghost-Notes-Columns-Setup.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Ghost Notes - single or two columns" --notes "Windows x64 installer with a per-note column toggle. Right-column content is preserved when hidden. This custom installer is unsigned."
