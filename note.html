<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --tint: 255, 224, 130;   /* default: yellow */
    --opacity: 0.85;
    --font-size: 15px;
    --mono-font: ui-monospace, "SF Mono", "Fira Code", Consolas, "Cascadia Code", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .note {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(var(--tint), var(--opacity));
    backdrop-filter: blur(2px);
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.18);
  }

  /* Drag handle / toolbar */
  .bar {
    height: 30px;
    flex: 0 0 30px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    -webkit-app-region: drag;
    background: rgba(0, 0, 0, 0.06);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .note:hover .bar { opacity: 1; }

  /* Click-through ("ghost") mode: keep the toolbar findable so you can turn it
     back off, and hint that the body now passes clicks through. */
  .note.ghost .bar { opacity: 1; }
  .note.ghost { outline: 2px dashed rgba(0, 0, 0, 0.25); outline-offset: -2px; }
  .note.ghost #ghost { background: rgba(0,0,0,0.18); color: rgba(0,0,0,0.85); }
  body.dark .note.ghost { outline-color: rgba(255,255,255,0.35); }
  body.dark .note.ghost #ghost { background: rgba(255,255,255,0.22); color: #fff; }

  /* Pinned (default) = always-on-top. Unpinned = normal window, dim the
     pin icon so its state is obvious at a glance. */
  #pin { opacity: 0.4; }
  #pin.active { opacity: 1; background: rgba(0,0,0,0.12); }
  body.dark #pin.active { background: rgba(255,255,255,0.18); }

  /* Monospace toggle: dim when off so the on-state matches pin. */
  #mono { opacity: 0.4; font-family: var(--mono-font); font-size: 13px; }
  #mono.active { opacity: 1; background: rgba(0,0,0,0.12); }
  body.dark #mono.active { background: rgba(255,255,255,0.18); }

  .color-control { position: relative; -webkit-app-region: no-drag; }
  .color-dot {
    display: block;
    width: 14px; height: 14px; border-radius: 50%;
    background: rgb(var(--tint));
    border: 1px solid rgba(0,0,0,0.2);
  }

  .color-popover {
    position: absolute;
    top: 26px; left: 0;
    padding: 8px;
    border-radius: 9px;
    background: rgba(250, 250, 252, 0.98);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    -webkit-app-region: no-drag;
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
    transition: opacity 0.12s ease, transform 0.12s ease;
    z-index: 20;
  }
  .color-popover.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
  body.dark .color-popover { background: rgba(46, 48, 54, 0.98); }

  .swatches {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .swatch {
    width: 16px; height: 16px; border-radius: 50%;
    cursor: pointer; border: 1px solid rgba(0,0,0,0.15);
  }
  .swatch.active { box-shadow: 0 0 0 2px rgba(0,0,0,0.4); }

  .spacer { flex: 1; }

  .btn {
    -webkit-app-region: no-drag;
    cursor: pointer;
    border: none;
    background: transparent;
    color: rgba(0,0,0,0.55);
    font-size: 15px;
    line-height: 1;
    padding: 2px 5px;
    border-radius: 5px;
  }
  .btn:hover { background: rgba(0,0,0,0.12); color: rgba(0,0,0,0.8); }

  input[type=range] {
    -webkit-app-region: no-drag;
    width: 58px;
    accent-color: rgba(0,0,0,0.5);
    cursor: pointer;
  }

  textarea {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    padding: 10px 12px;
    font-size: var(--font-size);
    line-height: 1.45;
    color: #1c1c1c;
    -webkit-user-select: text;
    user-select: text;
    font-family: inherit;
  }
  .note.mono textarea {
    font-family: var(--mono-font);
  }
  textarea::placeholder { color: rgba(0,0,0,0.35); }

  /* Dark theme readability */
  body.dark textarea { color: #f2f2f2; }
  body.dark textarea::placeholder { color: rgba(255,255,255,0.4); }
  body.dark .bar { background: rgba(255,255,255,0.08); }
  body.dark .btn { color: rgba(255,255,255,0.7); }
  body.dark .btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
</style>
</head>
<body>
  <div class="note">
    <div class="bar">
      <div class="color-control">
        <button class="btn" id="colorBtn" title="Note color"><span class="color-dot" id="colorDot"></span></button>
        <div class="color-popover" id="colorPopover">
          <div class="swatches" id="swatches"></div>
        </div>
      </div>
      <input type="range" id="opacity" min="30" max="100" title="Opacity" />
      <div class="spacer"></div>
      <button class="btn" id="fontDown" title="Smaller text">A−</button>
      <button class="btn" id="fontUp" title="Larger text">A+</button>
      <button class="btn" id="mono" title="Monospace: better for code snippets">{}</button>
      <button class="btn" id="pin" title="Pinned: stays on top when you switch apps">📌</button>
      <button class="btn" id="ghost" title="Click-through: see & click behind (⌘⇧G)">👻</button>
      <button class="btn" id="new" title="New note">＋</button>
      <button class="btn" id="close" title="Close note">✕</button>
    </div>
    <textarea id="text" placeholder="Your private notes… (invisible to screen sharing)" spellcheck="false"></textarea>
  </div>
  <script src="note.js"></script>
</body>
</html>
