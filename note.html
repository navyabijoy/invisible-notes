<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --tint: 255, 224, 130;   /* default: yellow */
    --opacity: 0.85;
    --font-size: 15px;
    --mono-font: ui-monospace, "SF Mono", "Fira Code", Consolas, "Cascadia Code", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .note {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(var(--tint), var(--opacity));
    backdrop-filter: blur(2px);
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.18);
  }

  /* Drag handle / toolbar */
  .bar {
    height: 30px;
    flex: 0 0 30px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    -webkit-app-region: drag;
    background: rgba(0, 0, 0, 0.06);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .note:hover .bar { opacity: 1; }

  /* Click-through ("ghost") mode: keep the toolbar findable so you can turn it
     back off, and hint that the body now passes clicks through. */
  .note.ghost .bar { opacity: 1; }
  .note.ghost { outline: 2px dashed rgba(0, 0, 0, 0.25); outline-offset: -2px; }
  .note.ghost #ghost { background: rgba(0,0,0,0.18); color: rgba(0,0,0,0.85); }
  body.dark .note.ghost { outline-color: rgba(255,255,255,0.35); }
  body.dark .note.ghost #ghost { background: rgba(255,255,255,0.22); color: #fff; }

  /* Pinned (default) = always-on-top. Unpinned = normal window, dim the
     pin icon so its state is obvious at a glance. */
  #pin { opacity: 0.4; }
  #pin.active { opacity: 1; background: rgba(0,0,0,0.12); }
  body.dark #pin.active { background: rgba(255,255,255,0.18); }

  /* Monospace toggle: dim when off so the on-state matches pin. */
  #mono { opacity: 0.4; font-family: var(--mono-font); font-size: 13px; }
  #mono.active { opacity: 1; background: rgba(0,0,0,0.12); }
  body.dark #mono.active { background: rgba(255,255,255,0.18); }

  .color-control { position: relative; -webkit-app-region: no-drag; }
  .color-dot {
    display: block;
    width: 14px; height: 14px; border-radius: 50%;
    background: rgb(var(--tint));
    border: 1px solid rgba(0,0,0,0.2);
  }

  .color-popover {
    position: absolute;
    top: 26px; left: 0;
    padding: 8px;
    border-radius: 9px;
    background: rgba(250, 250, 252, 0.98);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    -webkit-app-region: no-drag;
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
    transition: opacity 0.12s ease, transform 0.12s ease;
    z-index: 20;
  }
  .color-popover.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
  body.dark .color-popover { background: rgba(46, 48, 54, 0.98); }

  .swatches {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .swatch {
    width: 16px; height: 16px; border-radius: 50%;
    cursor: pointer; border: 1px solid rgba(0,0,0,0.15);
  }
  .swatch.active { box-shadow: 0 0 0 2px rgba(0,0,0,0.4); }

  .spacer { flex: 1; }

  .btn {
    -webkit-app-region: no-drag;
    cursor: pointer;
    border: none;
    background: transparent;
    color: rgba(0,0,0,0.55);
    font-size: 15px;
    line-height: 1;
    padding: 2px 5px;
    border-radius: 5px;
  }
  .btn:hover { background: rgba(0,0,0,0.12); color: rgba(0,0,0,0.8); }

  input[type=range] {
    -webkit-app-region: no-drag;
    width: 58px;
    accent-color: rgba(0,0,0,0.5);
    cursor: pointer;
  }

  .editor {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    padding: 10px 12px;
    font-size: var(--font-size);
    line-height: 1.45;
    color: #1c1c1c;
    -webkit-user-select: auto;
    user-select: auto;
    font-family: inherit;
    overflow-y: auto;
    cursor: text;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .editor[placeholder]:empty:before {
    content: attr(placeholder);
    color: rgba(0,0,0,0.35);
    pointer-events: none;
  }
  .note.mono .editor {
    font-family: var(--mono-font);
  }
  
  .editor h1 { font-size: calc(var(--font-size) * 1.35); margin: 0.2em 0; font-weight: bold; }
  .editor h2 { font-size: calc(var(--font-size) * 1.15); margin: 0.2em 0; font-weight: 600; }
  .editor h3 { font-size: calc(var(--font-size) * 0.9); margin: 0.2em 0; font-weight: 600; color: var(--muted); }
  .editor pre { font-family: var(--mono-font); font-size: calc(var(--font-size) * 0.9); background: rgba(0,0,0,0.05); padding: 2px 4px; border-radius: 4px; display: inline-block; }
  .editor ul, .editor ol { padding-left: 1.5em; margin: 0.2em 0; }
  .editor blockquote { border-left: 3px solid rgba(0,0,0,0.2); padding-left: 0.8em; margin: 0.2em 0; color: rgba(0,0,0,0.7); }
  body.dark .editor blockquote { border-left-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.7); }
  
  .format-control { position: relative; -webkit-app-region: no-drag; }
  .format-popover {
    position: absolute;
    top: 26px; right: 0; left: auto;
    padding: 4px;
    border-radius: 9px;
    background: rgba(250, 250, 252, 0.98);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    -webkit-app-region: no-drag;
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
    transition: opacity 0.12s ease, transform 0.12s ease;
    z-index: 20;
    display: flex;
    flex-direction: column;
    min-width: 140px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
  }
  .format-popover.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
  body.dark .format-popover { background: rgba(46, 48, 54, 0.98); }
  
  .format-btn {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    color: var(--ink);
    transition: background 0.15s;
    font-family: inherit;
    position: relative;
    margin-bottom: 2px;
  }
  .format-btn:last-child { margin-bottom: 0; }
  .format-btn:hover { background: rgba(0, 0, 0, 0.05); }
  body.dark .format-btn:hover { background: rgba(255, 255, 255, 0.08); }
  .format-btn.active {
    background: rgba(0,0,0,0.06);
    color: var(--accent);
  }
  body.dark .format-btn.active {
    background: rgba(255,255,255,0.1);
  }
  .format-btn.active::after {
    content: "✓";
    position: absolute;
    right: 12px;
    font-weight: bold;
    font-style: normal;
  }
  
  .format-divider { height: 1px; background: rgba(0,0,0,0.1); margin: 4px 0; flex-shrink: 0; }
  body.dark .format-divider { background: rgba(255,255,255,0.1); }

  /* Dark theme readability */
  body.dark .editor { color: #f2f2f2; }
  body.dark .editor[placeholder]:empty:before { color: rgba(255,255,255,0.4); }
  body.dark .bar { background: rgba(255,255,255,0.08); }
  body.dark .btn { color: rgba(255,255,255,0.7); }
  body.dark .btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

  .color-palette {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 8px 10px;
  }
  .color-swatch {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s;
    background: none;
    padding: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.dark .color-swatch { border-color: rgba(255,255,255,0.1); }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active {
    filter: brightness(0.85);
  }
  .color-swatch.active::after {
    content: "✓";
    color: white;
    font-size: 11px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
  <div class="note">
    <div class="bar">
      <div class="color-control">
        <button class="btn" id="colorBtn" title="Note color"><span class="color-dot" id="colorDot"></span></button>
        <div class="color-popover" id="colorPopover">
          <div class="swatches" id="swatches"></div>
        </div>
      </div>
      <input type="range" id="opacity" min="30" max="100" title="Opacity" />
      <div class="spacer"></div>
      <div class="format-control">
        <button class="btn" id="formatBtn" title="Formatting" style="font-family: Georgia, serif; font-style: italic; width: 24px; text-align: center; padding: 2px 0;">f</button>
        <div class="format-popover" id="formatPopover">
          <div class="color-palette">
            <button class="color-swatch" style="background: #ef4444" data-color="#ef4444" title="Red"></button>
            <button class="color-swatch" style="background: #f97316" data-color="#f97316" title="Orange"></button>
            <button class="color-swatch" style="background: #10b981" data-color="#10b981" title="Green"></button>
            <button class="color-swatch" style="background: #3b82f6" data-color="#3b82f6" title="Blue"></button>
            <button class="color-swatch" style="background: #8b5cf6" data-color="#8b5cf6" title="Purple"></button>
            <button class="color-swatch" style="background: #ec4899" data-color="#ec4899" title="Pink"></button>
          </div>
          <div class="format-divider"></div>
          <button class="format-btn" data-cmd="bold"><b>Bold</b></button>
          <button class="format-btn" data-cmd="italic"><i>Italic</i></button>
          <button class="format-btn" data-cmd="underline"><u>Underline</u></button>
          <button class="format-btn" data-cmd="strikeThrough"><s>Strikethrough</s></button>
          <button class="format-btn" data-cmd="removeFormat"><i>Clear Formatting</i></button>
          <div class="format-divider"></div>
          <button class="format-btn" data-cmd="formatBlock" data-val="H1" style="font-size: 1.2em; font-weight: bold;">Title</button>
          <button class="format-btn" data-cmd="formatBlock" data-val="H2" style="font-size: 1.1em; font-weight: bold;">Heading</button>
          <button class="format-btn" data-cmd="formatBlock" data-val="H3" style="font-weight: bold;">Subheading</button>
          <button class="format-btn" data-cmd="formatBlock" data-val="DIV">Normal Text</button>
          <button class="format-btn" data-cmd="formatBlock" data-val="PRE" style="font-family: monospace;">Monostyled</button>
          <div class="format-divider"></div>
          <button class="format-btn" data-cmd="insertUnorderedList">• Bulleted List</button>
          <button class="format-btn" data-cmd="insertOrderedList">1. Numbered List</button>
          <button class="format-btn" data-cmd="formatBlock" data-val="BLOCKQUOTE" style="border-left: 2px solid currentColor; padding-left: 4px; margin-left: 4px;">Block Quote</button>
        </div>
      </div>
      <button class="btn" id="fontDown" title="Smaller text">A−</button>
      <button class="btn" id="fontUp" title="Larger text">A+</button>
      <button class="btn" id="pin" title="Pinned: stays on top when you switch apps">📌</button>
      <button class="btn" id="ghost" title="Click-through: see & click behind (⌘⇧G)">👻</button>
      <button class="btn" id="new" title="New note">＋</button>
      <button class="btn" id="close" title="Close note">✕</button>
    </div>
    <div id="text" class="editor" contenteditable="true" placeholder="Your private notes… (invisible to screen sharing)" spellcheck="false"></div>
  </div>
  <script src="note.js"></script>
</body>
</html>
